# App icons for every platform, from assets/brand/ (drawn in tool/brand/*.svg).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/brand/icon.png
  android: true
  min_sdk_android: 24
  adaptive_icon_background: "#16607A"
  adaptive_icon_foreground: assets/brand/icon-foreground.png
  adaptive_icon_monochrome: assets/brand/icon-monochrome.png
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: assets/brand/icon.png
    background_color: "#F7F4EE"
    theme_color: "#17507A"
