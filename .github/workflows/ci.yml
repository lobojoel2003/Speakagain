name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Version, changelog and build number agree
        run: python3 tool/version.py check
      - name: Every pack folder is listed in pubspec.yaml
        run: python3 tool/sync_pack_assets.py --check
      - name: Every symbol the app uses is bundled (and no others)
        run: python3 tool/sync_symbols.py --check
      - name: Packs match the JSON schema
        run: |
          pip install --quiet "check-jsonschema==0.35.0"
          check-jsonschema --schemafile schema/pack.schema.json assets/packs/*/*/pack.json
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Tests
        run: flutter test --coverage --timeout 120s --exclude-tags screenshots
      - name: Screenshots
        run: flutter test --tags screenshots --timeout 300s
      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: build/screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - run: flutter pub get
      - name: Build APKs
        run: |
          flutter build apk --release --split-per-abi -Pforce-version-code-ignoring-abi=true \
            --dart-define=SPEAKAGAIN_CHANNEL=ci \
            --dart-define=SPEAKAGAIN_CI_RUN=${{ github.run_number }} \
            --dart-define=SPEAKAGAIN_COMMIT=${GITHUB_SHA::7}
          flutter build apk --release -Pforce-version-code-ignoring-abi=true \
            --dart-define=SPEAKAGAIN_CHANNEL=ci \
            --dart-define=SPEAKAGAIN_CI_RUN=${{ github.run_number }} \
            --dart-define=SPEAKAGAIN_COMMIT=${GITHUB_SHA::7}
      - name: APK sizes and version
        run: |
          ls -l build/app/outputs/flutter-apk/*.apk
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | head -3
      - uses: actions/upload-artifact@v7
        with:
          name: speakagain-android-test-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SPEAKAGAIN_CHANNEL=ci \
            --dart-define=SPEAKAGAIN_CI_RUN=${{ github.run_number }} \
            --dart-define=SPEAKAGAIN_COMMIT=${GITHUB_SHA::7}
      - uses: actions/upload-artifact@v7
        with:
          name: speakagain-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=SPEAKAGAIN_CHANNEL=ci \
            --dart-define=SPEAKAGAIN_CI_RUN=${{ github.run_number }} \
            --dart-define=SPEAKAGAIN_COMMIT=${GITHUB_SHA::7}
      - name: Package
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qr Speakagain-unsigned.ipa Payload)
          ls -l build/ipa/Speakagain-unsigned.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: speakagain-ios-unsigned
          path: build/ipa/Speakagain-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

  models:
    name: Model download links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Every file in the model catalog can be downloaded and has the listed size
        run: python3 tool/models/check_catalog.py
