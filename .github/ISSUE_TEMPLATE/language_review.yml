name: Language or pack review
description: Corrections to app text or packs in a language you speak fluently
labels: [language]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: corrections
    attributes:
      label: What should change?
      description: The current text, your suggestion, and why (more natural, regional word, grammar…).
    validations:
      required: true
  - type: checkboxes
    id: fluent
    attributes:
      label: Fluency
      options:
        - label: I speak this language fluently (machine translations aren't accepted)
          required: true
